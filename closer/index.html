function navigate(p){state.page=p;location.hash=p;render();window.scrollTo({top:0,behavior:'instant'})}window.addEventListener('hashchange',()=>{state.page=location.hash.slice(1)||'discover';render()});function heading(title,sub,action=''){return `<div class="greeting"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}function mini(p,i){return `<button class="mini" onclick="viewPerson(${i})"><img src="${photo(p.img,500)}" alt="Illustrative portrait for ${p.name}" loading="lazy"><span class="heart">♡</span><div class="label"><h3>${p.name}, ${p.age}</h3><p>⌖ ${p.city} · ${p.tags[1]}</p></div></button>`}
function render(){document.querySelector('.nav').innerHTML=['discover','likes','live','chats','profile','settings'].map(n=>`<button class="${state.page===n?'active':''} ${n==='settings'?'settings-nav':''}" onclick="navigate('${n}')" ${state.page===n?'aria-current="page"':''}>${icon(n)}<span>${n==='chats'?'Chats':n[0].toUpperCase()+n.slice(1)}</span>${n==='likes'&&state.liked.length?`<b class="count">${state.liked.length}</b>`:''}</button>`).join('');document.getElementById('bell').innerHTML=icon('bell');document.getElementById('cityLabel').textContent=state.city==='All cities'?'All cities, NG':state.city+', NG';let html='';if(state.page==='discover')html=discover();else if(state.page==='likes')html=likes();else if(state.page==='live')html=live();else if(state.page==='chats')html=chats();else if(state.page==='profile')html=profile();else if(state.page==='settings')html=settings();else if(state.page==='wallet')html=wallet();else if(state.page==='admin')html=admin();else html=discover();document.getElementById('content').innerHTML=html}
function discover(){const p=current();return heading('A good connection starts here<span class="accent">.</span>','A familiar feeling. Someone new. Let’s see who you find.',`<button class="glass filter" onclick="filters()">${icon('filter')}<span>Preferences</span></button>`)+`<div class="tabs">${['For you','Nearby','New here'].map(t=>`<button class="chip ${state.tab===t?'selected':''}" onclick="setTab('${t}')">${t}</button>`).join('')}</div><div class="main-grid"><section><div class="feature"><img src="${photo(p.img)}" alt="Illustrative portrait for ${p.name}"><div class="photo-bars"><span></span><span></span><span></span></div><div class="photo-top"><span class="badge"><span class="dot"></span> ${state.tab==='New here'?'New to Closer':'Open to something real'}</span><button class="round glass" aria-label="Profile options" onclick="personOptions()">•••</button></div><div class="photo-info"><button onclick="viewPerson(${people.indexOf(p)})" style="background:none;text-align:left;padding:0"><h2>${p.name}, ${p.age} <span class="verified" title="Illustrative verification badge">✓</span></h2></button><p>⌖ ${p.city}, Nigeria &nbsp; · &nbsp; ${p.job}</p><div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div></div></div><div class="actions"><button class="glass undo" aria-label="Previous profile" onclick="state.index=Math.max(0,state.index-1);render()">${icon('undo')}</button><button class="glass" aria-label="Pass profile" onclick="nextPerson()">${icon('close')}</button><button class="like" aria-label="Like profile" onclick="likePerson()">${icon('likes')}</button><button class="glass star" aria-label="Send special like" onclick="likePerson(true)">${icon('star')}</button><button class="glass undo" aria-label="Read profile" onclick="viewPerson(${people.indexOf(p)})">↗</button></div><div class="hint">Take your time. The right conversation is worth it.</div></section><aside class="rail"><div class="rail-card"><div class="small-label">LESS SMALL TALK. MORE SPARK.</div><div class="vibe-art"><div class="orb">✦</div><div class="orb">♡</div></div><h3>Meet your kind of energy.</h3><p>Three little questions. A whole new way to break the ice.</p><button class="text-btn" onclick="vibe()">Try a Vibe Check <span>↗</span></button></div><div class="rail-card"><div class="live-label"><span class="dot" style="background:#ff8a9e"></span> THE LIVE LOUNGE</div><div class="live-thumb"><img src="${photo('photo-1528605248644-14dd04022da1',500)}" alt="Friends sharing a conversation"><span>Preview room</span></div><h3 style="font-size:15px">Good people. Better gist.</h3><p>Drop into a conversation that feels like your kind of night.</p><button class="join" onclick="navigate('live')">Explore Live &nbsp; ↗</button></div><div class="safety">${icon('shield')}<p><strong>Your pace. Your space.</strong>You choose who gets closer.<br><a href="#settings">Explore privacy & safety</a></p></div></aside></div><div class="section-head"><h2>A few more possibilities</h2><small>Across your cities ↗</small></div><div class="mini-grid">${people.filter(q=>q!==p).map(q=>mini(q,people.indexOf(q))).join('')}</div>`}
function setTab(t){state.tab=t;if(t==='Nearby'){state.city=state.profile.city;state.index=0}else{state.city='All cities';state.index=t==='New here'?2:0}render()};function nextPerson(){state.index++;render()};function likePerson(special=false,id=people.indexOf(current())){if(!state.liked.includes(id))state.liked.push(id);persist();toast(`${special?'Special like':'Like'} saved for ${people[id].name} in this preview`);closeModal();state.index++;render()}
function likes(){return heading('A little mutual curiosity.','Your saved likes live here. A real match needs interest from both sides.')+`<div class="tabs"><button class="chip selected">Sent likes · ${state.liked.length}</button><button class="chip" onclick="toast('Received likes will appear when real accounts are connected.')">Received likes</button></div>`+(state.liked.length?`<div class="cards">${state.liked.map(i=>mini(people[i],i)).join('')}</div>`:`<div class="panel empty">${icon('likes')}<h2>Someone will catch your eye.</h2><p>Explore profiles and save your first like.</p><button class="primary" onclick="navigate('discover')">Discover people</button></div>`)}
function live(){return heading('Find your kind of room<span class="accent">.</span>','Good conversations don’t always start with a match.',`<button class="primary" onclick="goLive()">＋ Go live</button>`)+`<div class="tabs"><button class="chip selected">The lounge</button><button class="chip" onclick="room(1)">Speed dating</button><button class="chip" onclick="room(2)">Shared interests</button></div><div class="live-grid">${['Good people. Better gist.','The 5-minute introduction','Playlists & possibilities','Sunday, slowly'].map((t,i)=>`<button class="live-room" onclick="room(${i})"><img src="${photo(['photo-1528605248644-14dd04022da1','photo-1511632765486-a01980e01a18','photo-1516280440614-37939bbacd81','photo-1511988617509-a57c8a288659'][i],800)}" alt="${t}"><div class="label"><span class="badge">PREVIEW ROOM · 18+</span><h3>${t}</h3><p>${['Singles hangout','Speed dating','Music & culture','Slow conversations'][i]} &nbsp; ↗</p></div></button>`).join('')}</div><p class="demo-note">These are designed room previews, not active broadcasts. Streaming and live moderation need to be connected before launch.</p>`}
function chats(){let p=people[state.chat];return heading('Let the conversation happen.','A little hello can go a long way.')+`<div class="chat-layout"><div class="chat-list">${people.slice(0,3).map((p,i)=>`<button class="chat-person ${state.chat===i?'active':''}" onclick="state.chat=${i};render()"><img class="avatar" src="${photo(p.img,100)}" alt=""><span>${p.name}<small>Sample conversation</small></span></button>`).join('')}</div><div class="chat-body"><div class="row"><img class="avatar" src="${photo(p.img,100)}" alt=""><strong>${p.name}</strong><button class="round glass" style="margin-left:auto" aria-label="Video call" onclick="callPreview()">${icon('live')}</button><button class="round glass" aria-label="Conversation options" onclick="personOptions()">•••</button></div><div class="messages"><div class="bubble">What’s one place you could visit again and again?</div>${(state.messages[state.chat]||[]).map(m=>`<div class="bubble mine">${esc(m)}</div>`).join('')}<button class="text-btn" onclick="vibe()">✦ Try a Vibe Check together →</button></div><form class="chat-form" onsubmit="sendMessage(event)"><input id="message" aria-label="Message" placeholder="Say something that sounds like you…" required maxlength="1000"><button class="primary" aria-label="Send message">${icon('send')}</button></form><p class="demo-note">Demo conversation. Your messages stay in this browser and are not sent to anyone.</p></div></div>`}function sendMessage(e){e.preventDefault();const s=document.getElementById('message').value.trim();if(!s)return;(state.messages[state.chat]??=[]).push(s);persist();render()}
function profile(){return heading('Make room for the real you.','The little things are usually the interesting things.',`<button class="glass filter" onclick="navigate('settings')">${icon('settings')}</button>`)+`<div class="two-col"><form class="panel stack" onsubmit="saveProfile(event)"><div class="row"><img class="avatar" style="width:65px;height:65px" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&auto=format&fit=crop" alt="Sample profile portrait"><div><h2>${esc(state.profile.name)}</h2><p class="demo-note">Your local demo profile</p></div></div><label class="form-field">First name<input id="pname" value="${esc(state.profile.name)}" required maxlength="30"></label><label class="form-field">My city<select id="pcity">${['Oyo','Ibadan','Lagos'].map(c=>`<option ${state.profile.city===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="form-field">A little about me<textarea id="pbio" maxlength="300">${esc(state.profile.bio)}</textarea></label><label class="form-field">I’m looking for<select><option>A long-term relationship</option>Intentional dating</option>Still figuring it out</option>Casual dating</option></select></label><button class="primary">Save profile</button></form><div class="stack"><div class="panel"><div class="small-label">YOUR VOICE, YOUR STORY</div><h2 style="margin:16px 0">More than a photograph.</h2><p class="demo-note">A 30-second introduction helps your personality come through.</p><button class="secondary" onclick="toast('Voice recording is planned for the connected app.')">＋ Add voice introduction</button></div><div class="panel">${icon('shield')}<h2 style="margin:16px 0">Show up as yourself.</h2><p class="demo-note">Selfie verification will help confirm that your profile photos match you. It does not guarantee another person’s intentions.</p><button class="secondary" onclick="verification()">Explore verification</button></div><button class="secondary" onclick="onboarding()">Preview account setup →</button><button class="secondary" onclick="navigate('wallet')">My coins & gifts →</button><button class="secondary" onclick="navigate('admin')">Admin design preview →</button><button class="secondary" onclick="brand()">Explore the Closer identity →</button></div></div>`}function saveProfile(e){e.preventDefault();state.profile={name:document.getElementById('pname').value,city:document.getElementById('pcity').value,bio:document.getElementById('pbio').value};persist();toast('Profile saved on this device');render()}
function settings(){return heading('Your space. Your rules.','Choose how you show up and who gets closer.')+`<div class="two-col"><div class="panel"><h2>Privacy & preferences</h2>${[['Pause discovery','Take a break from being discovered.'],['Read receipts','Choose whether matches see when you read.'],['Notification sounds','Keep things quiet when you need to.']].map((a,i)=>`<label class="setting"><span>${a[0]}<p>${a[1]}</p></span><input type="checkbox" ${saved['setting'+i]?'checked':''} onchange="saveSetting(${i},this.checked)"></label>`).join('')}<p class="demo-note">Preview preferences are stored locally. Precise location is never shown in this design.</p></div><div class="panel stack"><h2>Safety & account</h2><button class="secondary" onclick="navigate('wallet')">Wallet & gifts</button><button class="secondary" onclick="navigate('admin')">Admin design preview</button><button class="secondary" onclick="report()">Report a concern</button><button class="secondary" onclick="verification()">Verification</button><button class="secondary" onclick="premium()">Membership</button><button class="secondary" onclick="modal('Clear this demo?', '<p>This removes saved likes, messages, and profile edits from this browser.</p><br><button class=primary onclick=clearDemo()>Clear local data</button>')">Clear demo data</button><p class="demo-note">Closer is a concept prototype for adults 18+. All profiles and conversations are illustrative; photos are representative stock imagery.</p></div></div>`}function saveSetting(i,v){saved['setting'+i]=v;localStorage.setItem('closer-demo',JSON.stringify({...saved,...state}));toast('Preference saved for this preview')}function clearDemo(){localStorage.removeItem('closer-demo');location.reload()}
function modal(title,body){lastFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="round glass" onclick="closeModal()" aria-label="Close dialog">${icon('close')}</button></div>${body}</section></div>`;document.querySelector('.modal button,.modal input')?.focus()}function closeModal(){document.getElementById('overlay').innerHTML='';lastFocus?.focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){const a=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea,.modal a')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});function toast(t){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=`<div class="toast">${esc(t)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',3500)}
function filters(){modal('Your kind of connection',`<form class="stack" onsubmit="event.preventDefault();state.city=document.getElementById('fcity').value;state.index=0;persist();closeModal();render()"><label class="form-field">Discover people in<select id="fcity">${['All cities','Oyo','Ibadan','Lagos'].map(c=>`<option ${state.city===c?'selected':''}>${c}</option>`).join('')}</select></label><p>City filtering works in this preview. Age and relationship preferences will use real profile data in the connected app.</p><button class="primary">Show possibilities</button></form>`)}function viewPerson(i){let p=people[i];modal(`${p.name}, ${p.age}`,`<img src="${photo(p.img,500)}" alt="Illustrative portrait" style="width:100%;height:250px;object-fit:cover;border-radius:15px;margin-bottom:18px"><p>⌖ ${p.city} · ${p.job}</p><p style="margin:15px 0">${p.bio}</p><div class="row"><button class="primary" onclick="likePerson(false,${i})">♡ Send a like</button><button class="secondary" onclick="report()">Report</button></div>`)}
let vStep=0,vAnswers=[];const questions=[['Your ideal first date?',['A quiet café','Dinner and a long walk','Something spontaneous']],['What makes a connection click?',['Shared humour','Thoughtful conversation','A sense of adventure']],['Your kind of Sunday?',['Slow morning, good food','Exploring somewhere new','Music and close friends']]];function vibe(start=true){if(start){vStep=0;vAnswers=[]}let q=questions[vStep];modal('A little Vibe Check',`<div class="small-label">${vStep+1} OF 3</div><h3 style="font:500 22px Manrope;margin:22px 0">${q[0]}</h3><div class="stack">${q[1].map((a,i)=>`<button class="secondary" onclick="vAnswer(${i})">${a}</button>`).join('')}</div>`)}function vAnswer(i){vAnswers.push(questions[vStep][1][i]);if(++vStep<3)vibe(false);else modal('Now that sounds like you.',`<p>Your conversation starters:</p><div class="stack" style="margin:20px 0">${vAnswers.map(a=>`<div class="panel">${a}</div>`).join('')}</div><p>A match would answer independently before your answers are revealed together.</p><br><button class="primary" onclick="closeModal();navigate('chats')">Explore a conversation</button>`)}
function room(i){modal(['Good people. Better gist.','The 5-minute introduction','Playlists & possibilities','Sunday, slowly'][i],`<div class="panel" style="text-align:center;padding:40px 20px">${icon('live')}<h3 style="margin:16px">Live room preview</h3><p>No broadcast is running. This is the room experience before a streaming provider is connected.</p></div><div class="row" style="margin-top:18px"><button class="secondary" onclick="gifts()">✦ Send gift</button><button class="secondary" onclick="toast('Co-host requests become available during a real broadcast.')">Join stage</button><button class="secondary" onclick="report()">Report</button></div>`)}function goLive(){modal('Set the scene.',`<form class="stack" onsubmit="event.preventDefault();toast('Room draft saved locally. Broadcasting needs a streaming service.');closeModal()"><label class="form-field">Room title<input placeholder="What are we talking about tonight?" required maxlength="80"></label><label class="form-field">Room type<select><option>Singles hangout</option><option>Speed dating</option><option>Shared interests</option></select></label><p>Your camera stays off in this prototype. The production flow will include device checks and moderation before broadcasting.</p><button class="primary">Preview room setup</button></form>`)}function callPreview(){modal('A face-to-face hello.',`<div class="panel" style="text-align:center;padding:40px">${icon('live')}<h3 style="margin:18px">Video call preview</h3><p>Real calls require a connected video service and the other person’s acceptance.</p></div>`)}
function personOptions(){modal('Your comfort comes first.',`<div class="stack"><button class="secondary" onclick="report()">Report profile or conversation</button><button class="secondary" onclick="closeModal();nextPerson();toast('Profile skipped in this preview. Account blocking needs real user accounts.')">Skip this profile</button></div>`)}function report(){modal('Tell us what happened.',`<form class="stack" onsubmit="event.preventDefault();toast('Report preview completed. No report has been sent.');closeModal()"><label class="form-field">Reason<select><option>Harassment or unwanted contact</option><option>Suspected underage account</option><option>Fake profile or scam</option><option>Inappropriate content</option><option>Something else</option></select></label><label class="form-field">More details<textarea placeholder="Share what would help a moderator understand."></textarea></label><p>Design preview only. Reports will need a staffed moderation queue before launch.</p><button class="primary">Preview report submission</button></form>`)}function verification(){modal('A bit more confidence.',`<div class="stack"><p>1. Confirm you are 18 or older.</p><p>2. Capture a live selfie through the verification provider.</p><p>3. Review the result and request another review if needed.</p><p>No identity documents or selfies are collected by this prototype.</p><button class="secondary" onclick="closeModal()">Got it</button></div>`)}function premium(){modal('Closer Plus',`<div class="small-label">MORE WAYS TO FIND YOUR PERSON</div><h3 style="font-size:24px;margin:20px 0">A little more possibility.</h3><div class="stack"><p>✦ Additional discovery preferences</p><p>✦ See incoming likes</p><p>✦ Profile boosts and special likes</p><p>✦ Extra visibility controls</p></div><p style="margin:22px 0">Pricing and billing are not active in this concept. Blocking, reporting, and essential safety controls stay free.</p><button class="primary" onclick="closeModal()">Keep exploring</button>`)}function notifications(){modal('You’re all caught up.',`<p>When someone matches with you or sends a message, you’ll find it here.</p><p class="demo-note">No real accounts are connected in this preview.</p>`)}function onboarding(){modal('Something real starts here.',`<form class="stack" onsubmit="event.preventDefault();closeModal();toast('Eligibility preview complete. Real signup needs authentication and age checks.')"><p>Create a profile that sounds like you. Closer is for adults 18 and older.</p><label class="form-field">Email<input type="email" required placeholder="you@example.com"></label><label class="row"><input type="checkbox" required style="width:auto"> I confirm I am 18 or older.</label><p class="demo-note">This form demonstrates the flow and does not create an account or submit your email.</p><button class="primary">Continue</button></form>`)}function brand(){modal('Closer. A considered connection.',`<div style="font:800 58px Manrope;letter-spacing:-4px;margin:10px 0">closer<span class="accent">.</span></div><p>Something real starts here.</p><div class="swatches">${['#10121c','#ff896e','#aa92ff','#7bd8ca','#efcc83','#faf8ff'].map(c=>`<span style="background:${c}" title="${c}"></span>`).join('')}</div><p>Midnight grounds the experience. Coral invites action. Violet adds curiosity, aqua signals reassurance, and amber brings warmth.</p><p style="margin-top:15px">Two open arcs form a sculpted C: independent people moving closer, with space to be themselves.</p>`)}

const giftCatalog=[{name:'Rose',icon:'❀',coins:5,color:'#ff91a8'},{name:'Spark',icon:'✦',coins:10,color:'#efcc83'},{name:'Heart',icon:'♡',coins:25,color:'#c1a0ff'},{name:'Bouquet',icon:'❃',coins:50,color:'#83d9c9'},{name:'Crown',icon:'♔',coins:100,color:'#efcc83'},{name:'Aurora',icon:'✺',coins:250,color:'#aa92ff'}];
function wallet(){return heading('A little appreciation goes a long way.','Collect coins. Celebrate good company. Share a little warmth.')+`<div class="two-col"><div class="panel"><div class="small-label">DEMO WALLET</div><h2 style="font:600 48px Manrope;margin:20px 0">✦ ${coinBalance} <span style="font-size:17px;color:var(--muted)">coins</span></h2><p class="demo-note">Illustrative balance only. Coins in this preview have no monetary value.</p><button class="primary" onclick="buyCoins()">＋ Get coins</button> <button class="secondary" onclick="gifts()">Explore gifts</button></div><div class="panel"><h2>Simple, transparent pricing.</h2><p class="demo-note" style="font-size:14px">50 coins = ₦200<br>1 coin = ₦4 purchase value<br>Rose · 5 coins = ₦20 purchase equivalent</p><p class="demo-note">Purchase value is not streamer earnings. Platform fees, payment costs, refunds, and payout terms must be defined before money is accepted.</p></div></div><div class="section-head"><h2>Something for every moment</h2></div><div class="cards">${giftCatalog.map((g,i)=>`<button class="panel" style="text-align:left" onclick="gifts(${i})"><div style="font-size:45px;color:${g.color}">${g.icon}</div><h3 style="margin:14px 0">${g.name}</h3><p style="color:var(--muted)">${g.coins} coins · ₦${g.coins*4} equivalent</p></button>`).join('')}</div><div class="section-head"><h2>Wallet activity</h2></div><div class="panel">${giftHistory.length?giftHistory.map(x=>`<div class="setting"><span>${x.title}<p>Preview transaction</p></span><strong>${x.amount>0?'+':''}${x.amount} coins</strong></div>`).join(''):'No activity yet. Try a demo top-up or gift.'}</div>`}
function buyCoins(){modal('Find your little thank-you.',`<p>Proposed launch pricing. Choose a pack to test the wallet.</p><div class="stack" style="margin-top:20px">${[50,125,250,500,1250].map(n=>`<button class="secondary" onclick="confirmTopup(${n})" style="display:flex;justify-content:space-between"><span>✦ ${n.toLocaleString()} coins</span><strong>₦${(n*4).toLocaleString()}</strong></button>`).join('')}</div><p class="demo-note">No payment is collected. All packs use the same ₦4 per coin rate.</p>`)}
function confirmTopup(n){modal('Confirm demo top-up',`<p>${n} coins for ₦${(n*4).toLocaleString()} at the proposed rate.</p><p style="margin:15px 0">This only updates the current preview session.</p><button class="primary" onclick="coinBalance+=${n};giftHistory.unshift({title:'Demo top-up',amount:${n}});closeModal();navigate('wallet');toast('Demo coins added. No charge made.')">Add demo coins</button>`)}
function gifts(){modal('Make their moment.',`<p>Recipient: Lounge host · sample streamer</p><p class="demo-note">Your demo balance: ${coinBalance} coins</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0">${giftCatalog.map((g,i)=>`<button class="glass" style="border-radius:15px;padding:16px 6px" onclick="confirmGift(${i})"><span style="display:block;font-size:33px;color:${g.color}">${g.icon}</span><strong style="display:block;margin:8px 0;font-size:12px">${g.name}</strong><small>${g.coins} coins</small></button>`).join('')}</div><button class="secondary" onclick="buyCoins()">＋ Get coins</button>`)}
function confirmGift(i){const g=giftCatalog[i];modal(`Send a ${g.name.toLowerCase()}?`,`<div style="text-align:center;font-size:65px;color:${g.color}">${g.icon}</div><p style="margin:15px 0">${g.coins} coins to the sample Lounge host. Purchase equivalent: ₦${g.coins*4}.</p><p class="demo-note">Preview only. No real streamer receives this gift.</p>${coinBalance>=g.coins?`<button class="primary" onclick="completeGift(${i})">Confirm · ${g.coins} coins</button>`:`<p>You'll need more demo coins.</p><br><button class="primary" onclick="buyCoins()">Get coins</button>`}`)}
function completeGift(i){const g=giftCatalog[i];if(coinBalance<g.coins)return;coinBalance-=g.coins;giftHistory.unshift({title:g.name+' to sample Lounge host',amount:-g.coins});closeModal();toast(g.name+' delivered in the demo');if(state.page==='wallet')render()}
function admin(){const menu=['Overview','Members','Reports','Live rooms','Coins & gifts','Payouts'];return heading('A thoughtful community starts here.','Closer admin · sample data · design preview',`<button class="secondary" onclick="navigate('discover')">Back to app ↗</button>`)+`<p class="demo-note">This is an accessible design demonstration, not a secure administrative system. Production access must use server-enforced admin roles and audit logs.</p><div class="tabs" style="overflow:auto">${menu.map(t=>`<button style="white-space:nowrap" class="chip ${adminTab===t?'selected':''}" onclick="adminTab='${t}';render()">${t}</button>`).join('')}</div>`+adminContent()}
function adminContent(){if(adminTab==='Overview')return `<div class="cards">${[['Sample members','248','#aa92ff'],['Reports awaiting review',adminReports.filter(r=>r.status==='Needs review').length,'#ff896e'],['Sample live rooms','4','#7bd8ca']].map(a=>`<div class="panel"><p style="color:var(--muted)">${a[0]}</p><h2 style="font:600 42px Manrope;color:${a[2]};margin-top:15px">${a[1]}</h2></div>`).join('')}</div><div class="two-col" style="margin-top:22px"><div class="panel"><h2>Today’s priorities</h2><div class="setting"><span>Review safety reports</span><button class="secondary" onclick="adminTab='Reports';render()">Review</button></div><div class="setting"><span>Check sample live rooms</span><button class="secondary" onclick="adminTab='Live rooms';render()">Open</button></div></div><div class="panel"><h2>Launch readiness</h2><p class="demo-note">Authentication · not connected<br>Payments · not connected<br>Streaming · not connected<br>Verification · not connected<br>Moderation team · to be configured</p></div></div>`;
if(adminTab==='Members')return `<div class="panel"><h2>Illustrative member directory</h2>${people.map((p,i)=>`<div class="setting"><div class="row"><img class="avatar" src="${photo(p.img,100)}" alt=""><span>${p.name}<p>${p.city} · ${p.age} years old</p></span></div><button class="secondary" onclick="viewPerson(${i})">Review profile</button></div>`).join('')}</div>`;
if(adminTab==='Reports')return `<div class="panel"><h2>Moderation queue</h2>${adminReports.map((r,i)=>`<div class="setting"><span>${r.id} · ${r.reason}<p>${r.status}</p></span><button class="secondary" onclick="reviewReport(${i})">Review</button></div>`).join('')}</div>`;
if(adminTab==='Live rooms')return `<div class="panel"><h2>Stream oversight</h2>${['Good people. Better gist.','The 5-minute introduction','Playlists & possibilities'].map((t,i)=>`<div class="setting"><span>${t}<p>Sample room · broadcast offline</p></span><button class="secondary" onclick="room(${i})">Inspect</button></div>`).join('')}<p class="demo-note">Live moderation will require session controls, reports, moderator access, and an audit trail.</p></div>`;
if(adminTab==='Coins & gifts')return `<div class="panel"><h2>Gift catalogue & pricing</h2><p class="demo-note">Base pack: ₦200 / 50 coins. Purchase rate: ₦4 per coin.</p>${giftCatalog.map(g=>`<div class="setting"><span style="color:${g.color}">${g.icon} ${g.name}</span><span>${g.coins} coins · ₦${g.coins*4} equivalent</span></div>`).join('')}<button class="secondary" style="margin-top:20px" onclick="navigate('wallet')">Test wallet journey</button></div>`;
return `<div class="panel"><h2>Streamer payout review</h2><div class="empty"><h3>No payable earnings</h3><p>Demo gifts do not create earnings or withdrawals.</p></div><p class="demo-note">Before enabling payouts: define the creator share, settlement delay, minimum withdrawal, identity checks, fraud handling, and refund policy. Never calculate balances or authorize payments only in the browser.</p></div>`}
function reviewReport(i){const r=adminReports[i];modal('Review '+r.id,`<p>${r.reason}</p><p class="demo-note">Sample record for testing the review workflow.</p><label class="form-field">Review notes<textarea id="reviewNotes" placeholder="Record a reason for your decision"></textarea></label><br><div class="row"><button class="primary" onclick="resolveReport(${i},'Reviewed')">Mark reviewed</button><button class="secondary" onclick="resolveReport(${i},'Escalated')">Escalate</button></div>`)}
function resolveReport(i,status){if(!document.getElementById('reviewNotes').value.trim()){toast('Add a review note first');return}adminReports[i].status=status;closeModal();render();toast('Sample report '+status.toLowerCase())}

state.page=location.hash.slice(1)||'discover';render();
</script></body></html>
